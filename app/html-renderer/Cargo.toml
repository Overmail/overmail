[package]
name = "overmail-html-renderer"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "overmail_html_renderer"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "svg", "woff", "floats"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.4"
anyrender = "=0.14.0"
anyrender_vello_cpu = "=0.18.0"
peniko = "0.6.0"
data-url = "0.3.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
markup5ever = "0.40.0"
stylo_static_prefs = "0.22.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
