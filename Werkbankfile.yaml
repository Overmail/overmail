project:
  id: overmail
  name: Overmail

services:
  - name: api
    modes:
      local:
        port: 30137

  - name: web
    modes:
      local:
        port: 30138

  # The only http target: Caddy decides what goes to Ktor and what goes to SvelteKit,
  # so the split is the same locally and in a deployed image.
  - name: caddy
    modes:
      docker:
        container: caddy
        port: 80

containers:
  - name: caddy
    image: caddy:2-alpine
    type: dependency
    volumes:
      - "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro"

http:
  - target_service: caddy

dependencies:
  postgres:
    18:
      databases:
        - overmail
